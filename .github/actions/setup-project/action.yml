
name: Setup Node Project
description: Used to setup node project and install dependencies

inputs:
  node-version:
    description: Node.js version
    required: true
    default: 26

runs:
  using: composite

  steps:

    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - run: npm ci
      shell: bash