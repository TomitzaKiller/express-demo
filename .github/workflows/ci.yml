
name: CI


on:
    push:
        branches: ['**']

    pull_request:
        branches: ['**']


jobs:

    test:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup NodeJS
              uses: actions/setup-node@v5
              with:
                node-version: 26
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm run test

    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup NodeJS
              uses: actions/setup-node@v5
              with:
                node-version: 26
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup NodeJS
              uses: actions/setup-node@v5
              with:
                node-version: 26
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: npm run build
