
name: CI


on:
    push:
        branches: ['**']

    pull_request:
        branches: ['**']


jobs:

    test:
        needs: lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-project
            - run: npm run test

    lint:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-project
            - run: npm run lint

    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22,24,26]

        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-project
            - run: npm run build
