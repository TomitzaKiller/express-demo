
name: CI


on:
    push:
        branches: ['**']

    pull_request:
        branches: ['**']


jobs:

    test:
        needs: lint
        runs-on: ${{ matrix.os }}

        strategy: &node-matrix
            fail-fast: false
            matrix:
                node-version: [22, 24, 26]
                os: [ubuntu-latest, windows-latest]

        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-project
              with:
                node-version: ${{ matrix.node-version }}

            - run: npm run test

            # - name: Coverage
            #   if: matrix.os == 'ubuntu-latest' && matrix.node-version == 26
            #   run: npm run coverage

    lint:
        needs: build
        runs-on: ${{ matrix.os }}

        strategy: *node-matrix

        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-project
              with:
                node-version: ${{ matrix.node-version }}

            - run: npm run lint

    build:
        runs-on: ${{ matrix.os }}

        strategy: *node-matrix

        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-project
              with:
                node-version: ${{ matrix.node-version }}

            - run: npm run build


    deploy:
        needs: test

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: 'Render live'

        steps:
            - name: Automatic deploy to Render
              run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
              env:
                RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
