
name: CI


on:
    push:
        branches: ['**']

    pull_request:
        branches: ['**']


jobs:

    test:
        needs: lint
        runs-on: ${{ matrix.os }}

        strategy: &node-matrix
            fail-fast: false
            matrix:
                node-version: [22, 24, 26]
                os: [ubuntu-latest, windows-latest]

        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-project
              with:
                node-version: ${{ matrix.node-version }}

            - run: npm run test

            # - name: Coverage
            #   if: matrix.os == 'ubuntu-latest' && matrix.node-version == 26
            #   run: npm run coverage

    lint:
        needs: build
        runs-on: ${{ matrix.os }}

        strategy: *node-matrix

        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-project
              with:
                node-version: ${{ matrix.node-version }}

            - run: npm run lint

    build:
        runs-on: ${{ matrix.os }}

        strategy: *node-matrix

        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-project
              with:
                node-version: ${{ matrix.node-version }}

            - run: npm run build
