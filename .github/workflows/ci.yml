
name: CI


on:
    push:
        branches: ['**']

    pull_request:
        branches: ['**']


jobs:

    test:
        needs: lint
        runs-on: ubuntu-latest

        strategy: &node-matrix
            matrix:
                node-version: [22, 24, 26]

        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-project
              with:
                node-version: ${{ matrix.node-version }}

            - run: npm run test

    lint:
        needs: build
        runs-on: ubuntu-latest

        strategy: *node-matrix

        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-project
              with:
                node-version: ${{ matrix.node-version }}

            - run: npm run lint

    build:
        runs-on: ubuntu-latest

        strategy: *node-matrix

        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup-project
              with:
                node-version: ${{ matrix.node-version }}

            - run: npm run build
